name: build-windows
on: [workflow_dispatch, push]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with: { version: '6.7.*', arch: win64_msvc2019_64 }
      - name: openssl and zlib
        run: vcpkg install openssl:x64-windows zlib:x64-windows
      - name: build TDLib (no LTO, Release only)
        run: |
          git clone --depth 1 https://github.com/tdlib/td.git
          cmake -S td -B tdbuild -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_INSTALL_PREFIX="$PWD/tdinstall"
          cmake --build tdbuild --target install --config Release --parallel 4
      - name: build app
        run: |
          cmake -B build -A x64 -DCMAKE_PREFIX_PATH="$PWD/tdinstall" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: package
        run: |
          windeployqt build/Release/TelegramPolice.exe
          Copy-Item tdinstall/bin/*.dll build/Release/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" build/Release/
          Get-ChildItem build/Release | Select -First 40
      - uses: actions/upload-artifact@v4
        with: { name: TelegramPolice, path: build/Release }
