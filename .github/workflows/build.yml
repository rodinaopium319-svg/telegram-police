name: build-windows
on: [workflow_dispatch, push]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with: { version: '6.7.*', arch: win64_msvc2019_64 }
      - run: vcpkg install tdlib:x64-windows openssl:x64-windows zlib:x64-windows
      - run: cmake -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: windeployqt build/Release/TelegramPolice.exe
      - uses: actions/upload-artifact@v4
        with: { name: TelegramPolice, path: build/Release }
